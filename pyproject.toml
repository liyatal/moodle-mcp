# Tooling config only (pytest + ruff). This project is a single script, not a package.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: talks to real Moodle sites; skipped unless MOODLE_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "tests"]
extend-exclude = [".venv", ".claude", "demo"]

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: imports, B: bugbear, UP: modern syntax,
# S...: a handful of "dangerous call" security rules (no blanket S, tests assert a lot).
select = ["E", "F", "W", "I", "B", "UP", "S102", "S301", "S307", "S506", "S602", "S605"]

[tool.ruff.lint.isort]
known-first-party = ["moodle_mcp", "support"]

[tool.ruff.lint.per-file-ignores]
# SITES table / long literals in the server file are kept readable rather than wrapped.
"moodle_mcp.py" = ["E501"]
