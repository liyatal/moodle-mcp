<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>moodle-mcp demo</title>
<style>
  :root {
    --bg: #0e1220; --card: #171c2e; --line: #262d45; --ink: #eef1fa; --mute: #8f98b8;
    --accent: #f59e42; --user: #2b3766; --ok: #4ade80; --chip: #1f2540;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: radial-gradient(1100px 600px at 15% -10%, #26306180, transparent 60%),
                radial-gradient(900px 500px at 100% 110%, #f59e4226, transparent 60%), var(--bg);
    color: var(--ink);
    font: 20px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  .scene { position: absolute; inset: 0; opacity: 0; }

  /* title / end cards */
  .card-center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .logo { font-size: 96px; line-height: 1; }
  h1 { font-size: 76px; letter-spacing: -2px; margin-top: 18px; font-weight: 800; }
  h1 span { color: var(--accent); }
  .tag { font-size: 30px; color: var(--mute); margin-top: 14px; }
  .url { margin-top: 34px; font: 600 26px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink);
         background: var(--chip); border: 1px solid var(--line); padding: 14px 26px; border-radius: 14px; }
  .pills { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
  .pill { font: 500 18px ui-monospace, "SF Mono", Menlo, monospace; color: var(--mute); background: var(--chip);
          border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; }

  /* chat scenes */
  .step { position: absolute; left: 60px; top: 40px; display: flex; align-items: center; gap: 16px; }
  .num { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #1a1205;
         font-weight: 800; font-size: 24px; display: grid; place-items: center; }
  .step b { font-size: 30px; letter-spacing: -.5px; }
  .badge { position: absolute; right: 60px; top: 46px; font-size: 17px; color: var(--mute);
           background: var(--chip); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; }
  .badge i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
  .chat { position: absolute; left: 60px; right: 60px; top: 112px; bottom: 44px; background: var(--card);
          border: 1px solid var(--line); border-radius: 22px; padding: 30px 36px; box-shadow: 0 30px 80px #0008; }
  .user { margin-left: auto; width: fit-content; max-width: 78%; background: var(--user); padding: 13px 20px;
          border-radius: 18px 18px 4px 18px; font-size: 22px; min-height: 58px; }
  .caret { display: inline-block; width: 2px; height: 24px; background: var(--ink); vertical-align: -4px; margin-left: 2px; }
  .tools { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .tool { font: 500 17px ui-monospace, "SF Mono", Menlo, monospace; background: var(--chip); border: 1px solid var(--line);
          border-radius: 10px; padding: 8px 13px; color: var(--mute); opacity: 0; }
  .tool em { font-style: normal; color: var(--accent); }
  .tool .st { display: inline-block; width: 20px; color: var(--mute); }
  .tool.done .st { color: var(--ok); }
  .answer { margin-top: 20px; font-size: 21px; }
  .answer > div { opacity: 0; margin-bottom: 9px; }
  .answer .row { display: flex; gap: 14px; align-items: baseline; background: #1c2238; border: 1px solid var(--line);
                 border-radius: 12px; padding: 10px 16px; }
  .answer .row b { flex: 1; font-weight: 600; }
  .answer .row span { color: var(--mute); font-size: 18px; }
  .answer .row u { text-decoration: none; color: var(--accent); font-weight: 600; font-size: 18px; white-space: nowrap; }
  .answer .lead { color: var(--mute); }
  .answer code { font: 500 18px ui-monospace, "SF Mono", Menlo, monospace; background: var(--chip); padding: 2px 7px; border-radius: 6px; }
  .note { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 14px; color: #5d6585; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SCENES = [
  { title: true },
  { label: "What's due?",
    user: "What do I need to submit this week?",
    tools: [["moodle", "upcoming_deadlines"]],
    answer: [
      `<div class="lead">3 things due in the next 7 days:</div>`,
      `<div class="row"><b>HW 3 · BJT amplifiers</b><span>Analog Circuits</span><u>Wed 23:59</u></div>`,
      `<div class="row"><b>Quiz 1 · chapters 1–3</b><span>Computer Organization</span><u>Thu 10:00</u></div>`,
      `<div class="row"><b>Problem set 5 · wave guides</b><span>Electromagnetic Fields</span><u>Sun 23:59</u></div>`,
      `<div>Start with HW 3 — it closes first.</div>`,
    ] },
  { label: "Grab the homework",
    user: "Download the new homework from Analog Circuits and add it to Notability",
    tools: [["moodle", "assignments"], ["moodle", "download_file"], ["shell", "open -a Notability"]],
    answer: [
      `<div class="lead">Found one new assignment: <b>HW 3 · BJT amplifiers</b>, due Wed 23:59.</div>`,
      `<div class="row"><b>📄 HW3_BJT_amplifiers.pdf</b><span>saved to</span><code>~/Downloads/moodle/analog</code></div>`,
      `<div class="row"><b>✏️ Opened in Notability</b><span>ready to write on</span></div>`,
      `<div>Nothing was submitted — that part stays yours.</div>`,
    ] },
  { label: "Catch up on announcements",
    user: "Any new announcements from my lecturers?",
    tools: [["moodle", "list_courses"], ["moodle", "forum_discussions ×3"]],
    answer: [
      `<div class="lead">3 new posts since Sunday:</div>`,
      `<div class="row"><b>Thursday's lecture moved to room 011</b><span>Electromagnetic Fields</span></div>`,
      `<div class="row"><b>Quiz 1 is closed-book, formula sheet attached</b><span>Computer Organization</span></div>`,
      `<div class="row"><b>Office hours now Mondays 14:00</b><span>Analog Circuits</span></div>`,
    ] },
  { label: "Understand the new project",
    user: "Explain the new project in Computer Organization",
    tools: [["moodle", "course_contents"], ["moodle", "download_file"], ["claude", "read project.pdf"]],
    answer: [
      `<div class="lead">It's a <b>single-cycle CPU in Verilog</b>. In short:</div>`,
      `<div class="row"><b>🎯 Goal</b><span>run 12 given test programs on your own datapath</span></div>`,
      `<div class="row"><b>📦 Hand in</b><span>code + 4-page report, teams of two</span><u>Dec 20</u></div>`,
      `<div class="row"><b>🧭 Start with</b><span>the ALU and register file — everything else plugs into them</span></div>`,
      `<div>Want a week-by-week plan up to the deadline?</div>`,
    ] },
  { end: true },
];

const root = document.getElementById("root");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);

let cursor = 0, n = 0;
for (const s of SCENES) {
  const el = document.createElement("div");
  el.className = "scene";
  s.el = el; s.start = cursor;
  if (s.title || s.end) {
    el.innerHTML = `<div class="card-center">
      <div class="logo">🎓</div>
      <h1>moodle<span>-mcp</span></h1>
      <div class="tag">${s.title ? "Talk to your Moodle. Ask instead of click." : "Read-only. Open source. Yours in two minutes."}</div>
      ${s.title
        ? `<div class="pills">${["courses", "deadlines", "assignments", "grades", "forums", "files"].map(p => `<span class="pill">${p}</span>`).join("")}</div>`
        : `<div class="url">github.com/raztassa2000-eng/moodle-mcp</div>`}
    </div>`;
    s.dur = s.title ? 3200 : 4200;
  } else {
    n++;
    el.innerHTML = `
      <div class="step"><div class="num">${n}</div><b>${s.label}</b></div>
      <div class="badge"><i></i>moodle connected</div>
      <div class="chat">
        <div class="user"><span class="txt"></span><span class="caret"></span></div>
        <div class="tools">${s.tools.map(([src, name]) => `<div class="tool"><span class="st">◌</span><em>${src}</em> · ${esc(name)}</div>`).join("")}</div>
        <div class="answer">${s.answer.join("")}</div>
      </div>
      <div class="note">Sample data for illustration</div>`;
    s.tType = 500;
    s.tSent = s.tType + s.user.length * 38 + 350;
    s.tTools = s.tools.map((_, i) => s.tSent + 350 + i * 950);
    s.tAns0 = s.tTools[s.tTools.length - 1] + 1000;
    s.dur = s.tAns0 + s.answer.length * 520 + 3400;
  }
  cursor += s.dur;
  root.appendChild(el);
}
window.TOTAL = cursor;

window.render = function (t) {
  for (const s of SCENES) {
    const lt = t - s.start;
    const on = lt >= 0 && lt < s.dur;
    const last = s === SCENES[SCENES.length - 1];
    s.el.style.opacity = on ? Math.min(ease(lt / 350), last ? 1 : ease((s.dur - lt) / 300)) : 0;
    if (!on) continue;
    if (s.title || s.end) {
      s.el.firstElementChild.style.transform = `scale(${0.96 + 0.04 * ease(lt / 900)})`;
      continue;
    }
    const chars = Math.floor(clamp((lt - s.tType) / (s.user.length * 38)) * s.user.length);
    s.el.querySelector(".txt").textContent = s.user.slice(0, chars);
    s.el.querySelector(".caret").style.opacity = lt < s.tSent && Math.floor(lt / 400) % 2 === 0 ? 1 : 0;
    s.el.querySelectorAll(".tool").forEach((el, i) => {
      const a = lt - s.tTools[i];
      el.style.opacity = ease(a / 250);
      el.style.transform = `translateY(${8 * (1 - ease(a / 250))}px)`;
      const done = a > 750;
      el.classList.toggle("done", done);
      el.querySelector(".st").textContent = done ? "✓" : "◌◔◑◕"[Math.floor(Math.max(a, 0) / 120) % 4];
    });
    [...s.el.querySelector(".answer").children].forEach((el, i) => {
      const a = lt - (s.tAns0 + i * 520);
      el.style.opacity = ease(a / 350);
      el.style.transform = `translateY(${10 * (1 - ease(a / 350))}px)`;
    });
  }
};
// Plays live when opened directly in a browser.
if (!new URLSearchParams(location.search).has("capture")) {
  const t0 = performance.now();
  (function loop() { render((performance.now() - t0) % TOTAL); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
